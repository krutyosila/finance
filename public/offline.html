<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-bootstrap-v1.js"></script>
    <title>Bağlantı gerekli — Kasa</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f7f9;
        --surface: #fff;
        --text: #223441;
        --muted: #667b88;
        --line: #e7ecef;
        --focus: #5888ba;
        background: var(--canvas);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --canvas: #0e1920;
          --surface: #14232c;
          --text: #dce8ee;
          --muted: #a9bac5;
          --line: #314652;
          --focus: #93b7e6;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --canvas: #0e1920;
        --surface: #14232c;
        --text: #dce8ee;
        --muted: #a9bac5;
        --line: #314652;
        --focus: #93b7e6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top, 0px))
          calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px))
          calc(24px + env(safe-area-inset-left, 0px));
        background: var(--canvas);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        padding: clamp(20px, 6vw, 38px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow-wrap: anywhere;
      }
      img {
        width: 54px;
        height: 54px;
        border-radius: 12px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -0.7px;
        margin: 0 0 14px;
      }
      p {
        font-size: 14px;
        line-height: 1.8;
        color: var(--muted);
        margin: 0 0 24px;
      }
      .retry {
        display: inline-block;
        background: #277e78;
        color: white;
        padding: 13px 18px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .retry:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 22px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/kasa-icon-192-v2.png" alt="Kasa" />
      <h1>Bağlantı gerekli.</h1>
      <p>
        Finansal kayıtlarınızı açmak ve yeni işlem kaydetmek için sunucuya bağlantı gerekir.
        Bağlantınız geldiğinde yeniden deneyin.
      </p>
      <a class="retry" href="/">Yeniden dene</a>
      <small
        >Bu uygulama finansal verileri çevrimdışı saklamaz ve bekleyen işlem kuyruğu
        oluşturmaz.</small
      >
    </main>
  </body>
</html>
